<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="100" cy="530" r="150" fill="rgba(255,255,255,0.05)"/>

  <!-- Content container -->
  <rect x="60" y="60" width="1080" height="510" rx="20" fill="rgba(255,255,255,0.1)"/>

  <!-- Name -->
  <text x="100" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white">
    Jens Thoemmes
  </text>

  <!-- Title -->
  <text x="100" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)">
    CNRS Senior Research Director | Sociologist
  </text>

  <!-- Affiliations -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.75)">
    CERTOP, Toulouse | Centre for Future of Work, Taylor's University Malaysia
  </text>

  <!-- Divider line -->
  <line x1="100" y1="320" x2="1100" y2="320" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Research areas label -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)" font-weight="500">
    RESEARCH FIELDS
  </text>

  <!-- Research keywords -->
  <text x="100" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="white">
    Working Time Regulation | Telework | Industrial Relations
  </text>
  <text x="100" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="white">
    Posted Workers | Temporalities | Future of Work
  </text>

  <!-- Website URL -->
  <text x="100" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">
    jens-thoemmes.com
  </text>

  <!-- Publication count badge -->
  <rect x="900" y="500" width="180" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="990" y="533" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="white" text-anchor="middle">
    76 Publications
  </text>
</svg>